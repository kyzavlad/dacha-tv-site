name: Apply supplier product timeout patch

on:
  push:
    branches:
      - chatgpt/supplier-product-timeout-20260827

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch only the heavyweight get_products sync call
        run: |
          python - <<'PY'
          from pathlib import Path

          sync = Path('lib/supplier/sync.ts')
          text = sync.read_text()

          old_constant = 'const DEFAULT_SUPPLIER_TIMEOUT_MS = 15000\n'
          new_constant = (
              'const DEFAULT_SUPPLIER_TIMEOUT_MS = 15000\n'
              '// The full JSON product payload is ~29 MB and was measured at 19.5s in production.\n'
              '// Give only that heavyweight call enough headroom while keeping all lightweight\n'
              '// supplier endpoints on the tighter 15s default and staying below the 60s route budget.\n'
              'const GET_PRODUCTS_SUPPLIER_TIMEOUT_MS = 35000\n'
          )

          if 'const GET_PRODUCTS_SUPPLIER_TIMEOUT_MS = 35000' not in text:
              if old_constant not in text:
                  raise SystemExit('expected DEFAULT_SUPPLIER_TIMEOUT_MS declaration not found')
              text = text.replace(old_constant, new_constant, 1)

          old_call = "const { raw, safeUrl, httpStatus, topLevelKeys } = await apiFetch('get_products', extra)"
          new_call = "const { raw, safeUrl, httpStatus, topLevelKeys } = await apiFetch('get_products', extra, GET_PRODUCTS_SUPPLIER_TIMEOUT_MS)"
          if new_call not in text:
              if old_call not in text:
                  raise SystemExit('expected full product sync get_products call not found')
              text = text.replace(old_call, new_call, 1)

          sync.write_text(text)

          test = Path('tests/supplier-product-timeout-budget.test.mjs')
          test.write_text("""import { test } from 'node:test'\nimport assert from 'node:assert/strict'\nimport { readFileSync } from 'node:fs'\n\nconst src = readFileSync(new URL('../lib/supplier/sync.ts', import.meta.url), 'utf8')\n\ntest('heavy product feed has dedicated timeout without relaxing lightweight supplier calls', () => {\n  assert.match(src, /const DEFAULT_SUPPLIER_TIMEOUT_MS = 15000/)\n  assert.match(src, /const GET_PRODUCTS_SUPPLIER_TIMEOUT_MS = 35000/)\n  assert.match(\n    src,\n    /apiFetch\\('get_products', extra, GET_PRODUCTS_SUPPLIER_TIMEOUT_MS\\)/,\n  )\n  assert.match(\n    src,\n    /async function apiFetch\\(method: string, extra: Record<string, string> = \{\}, timeoutMs = DEFAULT_SUPPLIER_TIMEOUT_MS\\)/,\n  )\n})\n""")
          PY

      - name: Commit patch if needed
        run: |
          if git diff --quiet -- lib/supplier/sync.ts tests/supplier-product-timeout-budget.test.mjs; then
            echo "Timeout patch already present; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/supplier/sync.ts tests/supplier-product-timeout-budget.test.mjs
          git commit -m "fix: allow measured product feed download headroom"
          git push origin HEAD:chatgpt/supplier-product-timeout-20260827
